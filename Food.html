<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Card</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-lg-3 col-sm-12">
                <div class="card p-2 text-center shadow">
                    <img src="Biriyani.png" class="img-top">
                    <div class="card-body">
                        <h5 class="card-title">Biriyani</h5>
                        <p class="price">299<button class="btn btn-primary">Nonveg</button></p>
                        <p>Delicious biriyani made with fragrant basmati rice, tender meat , and rich spices.</p><hr>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3 col-sm-12">
                <div class="card p-2 text-center shadow">
                    <img src="Tanduri.jpg" class="img-top">
                    <div class="card-body">
                        <h5 class="card-title">Tandoori</h5>
                        <p class="price">199<button class="btn btn-primary">Nonveg</button></p>
                        <p>Smoky and flavourful Tandoori, cooked in a traditional clay oven with rich spices.</p><hr>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
