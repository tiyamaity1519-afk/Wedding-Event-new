<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="CSS/style.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container mt-5 pb-3 card">
        <h4 class="text-center bg-light pt-2 pb-2">Registration Form</h4>


       <form action="">
        <div class="row">
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Name</lable>
                <input type="text" name="name" placeholder="Enter Name" class="form-control">
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Phone</lable>
                <input type="number" name="num" placeholder="Enter Number" class="form-control">
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Email</lable>
                <input type="email" name="email" placeholder="Enter Email" class="form-control">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Date of Birth</lable>
                <input type="date" name="DOB" class="form-control">
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Time</lable>
                <input type="time" name="time"  class="form-control">
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="" class="pt-2">Gender</lable><br>
                <input type="radio" name="Gender" value="Male">Male
                <input type="radio" name="Gender" value="Female">Female
                <input type="radio" name="Gender" value="Others">Others
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">State</lable>
                <select name="" class="form-control">
                    <option disabled selected value="">---Selected---</option>
                    <option value="WB">WB</option>
                    <option value="UP">UP</option>
                    <option value="UK">UK</option>
                    <option value="MP">MP</option>
                    <option value="AB">AB</option>
                </select>
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <lable for="">Image</lable>
                <input type="file" name="img"  class="form-control">
            </div>
            <div class="col-md-4 col-lg-4 col-sm-12">
                <label for="">Password</label>
                <input type="password" name="pass" class="form-control" placeholder="Enter Password">       
            </div>
        </div>

        <div class="row mt-3" >
            <div class="col-md-8 col-lg-8 col-sm-12">
                <lable for="">Message</lable>
                <textarea name="msg" rows="3" class="form-control"></textarea>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-10 col-lg-10 col-sm-12"></div>
            <div class="col-md-2 col col-lg-2 col-sm-12">
                <input type="submit" name="" value="Register Now" class="mt-3 btn btn-info">
            </div>
        </div>
       </form>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
