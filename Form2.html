<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   
   <div class="container mt-5 pb-3 card">
    <h4 class="bg-light pb-2 pt-2">Add Award</h4>

    <form action="">
        <div class="row mt-3">
            <div class="col-lg-6 col-md-6 col-sm-12 mb-4">
                <label for="">Award Type</label>
                <select class="form-select" class="form-control">
                    <option disabled selected value="">--Select Award Type--</option>
                    <option value="Gold">Gold</option>
                    <option value="Silver">Silver</option>
                    <option value="Bronze">Bronze</option>
                    
                </select>
            </div>
            <div class=" col-lg-6 col-md-6 col-sm-12 mb-4">
                <label for="">Name</label>
                <input type="text" name="name" placeholder="Enter Award Name" class="form-control">

            </div>
        </div>
        <div class="row mt-3">
            <div class="col-lg-6 col-md-6 col-sm-12 mb-4">
                <label for="">Upload Image</label>
                <input type="file" name="img" class="form-control">
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 mb-4">
                <label for="">Order ID(Priority)</label>
                <input type="number" name="num" value="2" class="form-control">
                <small>Higher number=Shows later</small>
            </div>
        </div>
        <div class="row mt-3">
            <div class="preview-box">
                <h4>preview</h4>
                
            </div>

        </div>
       <div class="mb-3"> 
                <lable for="">Description</lable>
                <textarea class="form-control" rows="5" placeholder="Enter description...."></textarea>
            
        </div>

        
        <div class="bottom-btn">
            <button class="btn btn-light">Cancle</button>
            <button class="btn btn-success">Save</button>
        </div>
    </form>
   </div>
    




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
