<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu</title>
  <link rel="stylesheet" href="CSS/style1.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="container">
    <!-- Category Buttons -->
    <div class="category-buttons">
      <button class="btn active btn-warning">All Food Item</button>
      <button class="btn btn-warning">Veg</button>
      <button class="btn btn-warning">Non Veg</button>
      <button class="btn btn-warning">Tea</button>
      <button class="btn btn-warning">Fast Food</button>
      <button class="btn btn-warning">Sweets</button>
    </div>

    <!-- Food Cards -->
    <div class="food-container">

      <!-- Card 1 -->
      <div class="food-card">
        <img src="image/Veg Thali.jpg" alt="Veg Thali">
        <div class="food-details">
          <h3>Veg Thali</h3>
          <p class="price">₹ 60</p>
          <p><b>Category :</b> veg</p>
          <button class="order-btn btn-success">Order Place</button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="food-card">
        <img src="image/Chicken tandoori.jpg" alt="Chicken">
        <div class="food-details">
          <h3>Chicken</h3>
          <p class="price">₹ 120</p>
          <p><b>Category :</b> nonveg</p>
          <button class="order-btn btn-success">Order Place</button>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="food-card">
        <img src="image/Pizza.jpg" alt="Burger">
        <div class="food-details">
          <h3>Pizza</h3>
          <p class="price">₹ 339</p>
          <p><b>Category :</b> fastfood</p>
          <button class="order-btn btn-success">Order Place</button>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="food-card">
        <img src="image/Peanut_Butter_desert (1).jpg" alt="Kulhad">
        <div class="food-details">
          <h3>Desert</h3>
          <p class="price">₹ 59</p>
          <p><b>Category :</b> Desert</p>
          <button class="order-btn btn-success">Order Place</button>
        </div>
      </div>


    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
